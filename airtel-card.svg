<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#171717"/><stop offset="0.55" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bdbdbd"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect width="900" height="150" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="150" fill="url(#bg)"/>
    <circle cx="70" cy="100" r="120" fill="#9a9a9a" fill-opacity="0.10"><animate attributeName="r" values="100;140;100" dur="4s" repeatCount="indefinite"/></circle>
    <rect x="-260" width="260" height="150" fill="url(#shine)"><animate attributeName="x" from="-260" to="1000" dur="4.5s" repeatCount="indefinite"/></rect>
    <!-- signal waves -->
    <g stroke="url(#red)" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M45.86 85.86 A20 20 0 0 1 74.14 85.86"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0s" repeatCount="indefinite"/></path>
      <path d="M34.54 74.54 A36 36 0 0 1 85.46 74.54"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.25s" repeatCount="indefinite"/></path>
      <path d="M23.23 63.23 A52 52 0 0 1 96.77 63.23"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></path>
    </g>
    <circle cx="60" cy="100" r="7" fill="#f5f5f0"/>
    <!-- text -->
    <g transform="translate(140 34)"><rect width="150" height="26" rx="13" fill="url(#red)"/>
      <text x="75" y="18" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12.5" font-weight="700" fill="#0a0a0a" letter-spacing="1">EX-INTERN · 2026</text></g>
    <text x="140" y="98" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#fff">Bharti Airtel</text>
    <text x="140" y="124" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#a3a3a3">industry internship  ·  real-world engineering exposure</text>
    <!-- right side equalizer -->
    <g fill="#f5f5f0" fill-opacity="0.75">
      <rect x="790" y="60" width="8" height="40" rx="4"><animate attributeName="height" values="14;44;14" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="86;58;86" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="806" y="60" width="8" height="40" rx="4"><animate attributeName="height" values="30;12;30" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="70;88;70" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="822" y="60" width="8" height="40" rx="4"><animate attributeName="height" values="10;48;10" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="90;56;90" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="838" y="60" width="8" height="40" rx="4"><animate attributeName="height" values="36;16;36" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="68;84;68" dur="1.25s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <rect x="1" y="1" width="898" height="148" rx="21" stroke="#f5f5f0" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>