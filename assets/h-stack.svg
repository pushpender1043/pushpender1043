<svg xmlns="http://www.w3.org/2000/svg" width="900" height="92" viewBox="0 0 900 92"><style>@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.sg{font-family:'Space Grotesk',system-ui,'Segoe UI',sans-serif}
.jb{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.pf{font-family:'Playfair Display',Georgia,serif;font-style:italic}
